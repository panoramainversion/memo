<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>碎碎念</title>
<meta name="description" content="一个人的房间。想到什么写什么。" />
<link rel="stylesheet" href="/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f4f1ec" id="themeColor" />
<link rel="alternate" type="application/rss+xml" title="RSS" href="/feed.xml" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23b84200'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f4f1ec'/%3E%3C/svg%3E" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<main class="page">
  <header class="site">
    <div class="site-row">
      <div>
        <h1 class="site-title" id="siteTitle">
          <span class="skeleton sk-title"></span>
        </h1>
        <p class="site-desc" id="siteDesc"></p>
      </div>
      <div class="site-actions">
        <button class="icon-btn" id="adminBtn" aria-label="管理" title="管理站点与数据">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4.8v4.4M10 14.8v4.4" />
          </svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换主题">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="filter" id="filter" hidden>
    <span class="filter-text" id="filterText"></span>
    <button class="filter-clear" id="filterClear">清除</button>
  </div>

  <div class="stream" id="stream"></div>

  <div class="state" id="empty" hidden>
    <p class="state-main">这里还空着</p>
    <p class="state-sub">第一句话往往最难写。</p>
  </div>

  <div class="state" id="loading" hidden>
    <span class="dots"><i></i><i></i><i></i></span>
  </div>

  <div class="state" id="error" hidden>
    <p class="state-main">没能加载出来</p>
    <p class="state-sub" id="errorMsg"></p>
    <button class="link-btn" id="retryBtn">重试</button>
  </div>

  <footer class="foot">
    <a href="/feed.xml" class="foot-link">RSS</a>
    <span class="foot-dot">·</span>
    <button class="foot-link" id="searchBtn">搜索</button>
    <input class="foot-input" id="searchInput" placeholder="找点什么…" hidden />
    <span class="foot-dot">·</span>
    <button class="foot-link" id="loginBtn">登录</button>
    <span class="foot-count" id="footCount"></span>
  </footer>
</main>

<!-- 写作时的背景柔化层 -->
<div class="compose-veil" id="composeVeil" aria-hidden="true"></div>

<!-- 发布条 -->
<div class="dock" id="dock" hidden>
  <div class="dock-inner">
    <textarea id="composerInput" rows="1" placeholder="写点什么…" maxlength="5000"></textarea>
    <div class="dock-actions">
      <span class="counter" id="counter"></span>
      <button class="btn-primary" id="publishBtn" disabled>发布</button>
    </div>
  </div>
</div>

<!-- 登录弹层 -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="登录">
    <h2 class="modal-title">只有你能进</h2>
    <p class="modal-sub">输入管理密码，开始记录。</p>
    <input type="password" id="pwInput" class="input" placeholder="密码" autocomplete="current-password" />
    <p class="modal-err" id="pwErr"></p>
    <div class="modal-actions">
      <button class="btn-ghost" data-close>取消</button>
      <button class="btn-primary" id="pwSubmit">进入</button>
    </div>
  </div>
</div>

<!-- 管理弹层 -->
<div class="modal admin-modal" id="adminModal" hidden>
  <div class="modal-backdrop" data-admin-close></div>
  <div class="modal-card admin-card" role="dialog" aria-modal="true" aria-label="管理">
    <header class="admin-head">
      <div>
        <h2 class="modal-title">管理</h2>
        <p class="modal-sub">站点配置与数据备份</p>
      </div>
      <button class="admin-close" type="button" data-admin-close aria-label="关闭">×</button>
    </header>

    <div class="admin-tabs" role="tablist" aria-label="管理分类">
      <button class="admin-tab is-active" type="button" role="tab" aria-selected="true" data-pane="site">站点配置</button>
      <button class="admin-tab" type="button" role="tab" aria-selected="false" data-pane="backup">备份与恢复</button>
    </div>

    <div class="admin-panes">
      <section class="admin-pane" id="adminPaneSite" role="tabpanel">
        <label class="field">
          <span>站点标题</span>
          <input class="input" id="cfgTitle" maxlength="80" autocomplete="off" />
        </label>
        <label class="field">
          <span>一句话描述</span>
          <textarea class="input" id="cfgDesc" rows="2" maxlength="300"></textarea>
        </label>
        <div class="field-row">
          <label class="field">
            <span>作者</span>
            <input class="input" id="cfgAuthor" maxlength="80" autocomplete="off" />
          </label>
          <label class="field field-narrow">
            <span>时区</span>
            <input class="input" id="cfgTz" type="number" min="-12" max="14" step="0.25" inputmode="decimal" />
          </label>
        </div>
        <label class="field">
          <span>语言</span>
          <input class="input" id="cfgLang" maxlength="24" autocomplete="off" />
        </label>
        <p class="admin-hint">保存后立即生效；RSS 的时间也会按这里的时区显示。</p>
        <div class="admin-actions">
          <span class="admin-status" id="siteStatus"></span>
          <button class="btn-primary" type="button" id="saveSiteBtn">保存配置</button>
        </div>
      </section>

      <section class="admin-pane" id="adminPaneBackup" role="tabpanel" hidden>
        <div class="backup-block">
          <h3 class="backup-title">导出备份</h3>
          <p class="backup-text">把全部条目和站点配置打包成一个 JSON 文件。建议定期下载，放在网盘或本地留一份。</p>
          <button class="btn-ghost" type="button" id="exportBtn">下载备份</button>
        </div>

        <div class="backup-block">
          <h3 class="backup-title">恢复备份</h3>
          <p class="backup-text">支持本项目的备份文件，也兼容 <code>wrangler d1 --json</code> 导出的结果。</p>
          <input type="file" id="restoreFile" accept=".json,application/json" hidden />
          <button class="btn-ghost" type="button" id="pickFileBtn">选择文件</button>
          <p class="file-name" id="fileName">还没有选择文件</p>
          <label class="check"><input type="checkbox" id="restoreSite" checked /> 同时恢复站点配置</label>
          <label class="check"><input type="checkbox" id="replaceMode" /> 覆盖现有数据（会先清空全部条目）</label>
          <div class="admin-actions">
            <span class="admin-status" id="restoreStatus"></span>
            <button class="btn-primary" type="button" id="restoreBtn" disabled>开始恢复</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
